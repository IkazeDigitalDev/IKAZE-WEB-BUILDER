ls:["Why Ikaze Web Builder exists|For many small businesses, creators, schools and community groups in Africa, having a good website still feels out of reach. Hiring a developer can be expensive, free tools can be confusing, and many options are not designed for local needs, languages or payment habits.|Ikaze Web Builder starts from a simple belief: if you can describe what you do, you should be able to show it to the world. We are building a tool that tries to make that step shorter, clearer and more affordable, beginning in Rwanda.",
"Three ways to start|The plan is to let you begin in the way that suits you. You could describe your idea in your own words and receive a first draft, pick a ready-made template and change it, or open a blank page and build everything yourself.|None of these paths exists yet, but the idea behind all of them is the same: you stay in control. A draft, a template or a blank page are only starting points, and everything should remain editable by you.",
"How the AI is meant to help|AI is planned as an assistant, not a replacement for your judgment. You would describe a business, such as a tailoring shop in Kigali, and the tool would suggest pages, headings and wording that you can accept, change or throw away.|We want it to be honest about what it does. Drafts can contain mistakes, so you should always read, correct and make the text your own before sharing it with customers. The AI features depend on a secure server connection that is still being set up.",
"Templates for real needs|A template marketplace is planned with designs for businesses, portfolios, online shops, schools, hospitals, restaurants, hotels, churches, NGOs, real estate, news, blogs, music, agencies, landing pages, dashboards and learning platforms.|The templates you see on this site are demo sketches with sample prices. When the marketplace opens, each one should show a preview, its features, whether it works well on phones, and a clear price in Rwandan francs before you decide.",
"More than websites|Beyond websites, we want to support simple web applications: booking pages, inventory trackers, school records, small customer lists and dashboards. Many organisations need these tools but cannot afford custom software.|This is a long-term goal. Applications need databases, accounts and careful security, so they will come after the website tools are working well. We would rather launch fewer things that work than many that only look good.",
"Built for phones and real connections|Most people in our region reach the internet from a phone, often on a limited data plan. That is why the design is mobile-first, and why we aim for lightweight pages that load quickly.|We are not publishing speed numbers because we have not measured a finished product yet. When we have real results, we will share them honestly instead of making promises we cannot prove.",
"Your language|This website already works in English, Kinyarwanda and French, and your choice is remembered when you come back. Language matters because people trust and understand what is written the way they speak.|In the future we hope to support more languages, including Swahili, and to help site owners publish their own pages in several languages. Translations will always need a human to read them before they are published.",
"Clear, fair pricing|Prices on this site are in Rwandan francs and are examples, not final offers. The idea is to separate one-time costs, such as buying a template, from recurring costs, such as hosting, so that nothing is hidden.|We plan to support mobile money and card payments through trusted providers. Until that is ready, nothing on this site can be bought, and we will never say a payment worked unless the provider has confirmed it.",
"Security and privacy|Secret keys for AI, translation and payments must stay on a server and never inside the web page. Accounts will use well-known sign-in methods, and each person should only be able to see and change their own projects.|For now, the only information we collect is the name and email you send to join the early-access list. We use it only to contact you about this product and you can ask us to delete it at any time.",
"The road ahead|The honest roadmap has several steps. First, this public website. Next, accounts and sign-in. Then templates and saving projects, followed by the visual editor, the AI assistant, publishing, and finally payments and an administration area.|We will update this page as each step really becomes available. If you join the early-access list, we will write to you when there is something you can try, and your feedback will help decide what comes next.",
"Why a globe and a solar system?|The background of this page shows our planet inside the solar system. As you scroll, the view moves away from Earth until you can see the Sun and the planets circling it. It is a reminder that great things begin small and can reach far.|It is a decorative scene, with sizes and distances shortened so everything fits on screen. The planets really do orbit the Sun in roughly the order you see here. Below you can read a few facts about each one."],

pn:["Sun|A star that holds about 99.8% of the solar system’s mass. Its light takes a little over 8 minutes to reach Earth.","Mercury|The smallest planet and the closest to the Sun. It has almost no atmosphere.","Venus|The hottest planet, wrapped in thick clouds. A day on Venus is longer than its year.","Earth|Our home and the only place we know with life. About 71% of its surface is water.","Mars|A cold, dusty world with the tallest volcano in the solar system, Olympus Mons.","Jupiter|The largest planet, a gas giant whose Great Red Spot storm is bigger than Earth.","Saturn|Famous for its rings of ice and rock. It has many known moons.","Uranus|An ice giant that spins tilted on its side.","Neptune|The farthest planet: dark, cold and very windy."],

tm:["Amategeko n’amabwiriza","Uru rubuga ni urwo gutanga amakuru. Uburyo bwo kubaka, konti, imiterere n’ibiciro biracyategurwa kandi ntibirabaho.","Ibiranga, ibiciro n’uburyo bwo kwishyura biteganyijwe bishobora guhinduka mbere yo gutangira.","Kwiyandikisha ku rutonde si ukugura, kandi ntibikwizeza ko uzabona uburyo."],

rt2:"Manuka usome inkuru yose — hafi iminota 5.",
ls:["Impamvu Ikaze Web Builder ibaho|Ku bacuruzi benshi bato, abahanzi, amashuri n’amatsinda yo muri Afurika, kugira urubuga rwiza biracyasa n’ibigoye. Gukodesha umuhanga bishobora kugura menshi, ibikoresho by’ubuntu bishobora kuvuruguta, kandi byinshi ntibyateguriwe ibyo dukeneye, indimi zacu n’uburyo bwacu bwo kwishyura.|Ikaze Web Builder ishingiye ku kwizera koroheje: niba ushobora gusobanura ibyo ukora, ugomba kubigaragariza isi. Turimo kubaka igikoresho kigamije kugabanya urwo rugendo, kurworoshya no kurugira ruhendutse, duhereye mu Rwanda.",
"Inzira eshatu zo gutangira|Intego ni uko watangira mu buryo bukunogeye. Washobora gusobanura igitekerezo cyawe mu magambo yawe ukabona igishushanyo cya mbere, ugahitamo imiterere yateguwe ukayihindura, cyangwa ugafungura urupapuro rutarimo ikintu ukiyubakira byose.|Nta nzira n’imwe irabaho ubu, ariko igitekerezo kiri inyuma yazo zose ni kimwe: ni wowe ugenzura. Igishushanyo, imiterere cyangwa urupapuro rwera ni intangiriro gusa, kandi byose bigomba kuguma biri mu bubasha bwawe bwo kubihindura.",
"Uko AI iteganyijwe gufasha|AI iteganyijwe kuba umufasha, ntiyasimbura ubushishozi bwawe. Wasobanura ubucuruzi, nk’iduka ry’imyenda i Kigali, maze igikoresho kigatanga inama z’impapuro, imitwe y’ibiganiro n’amagambo, ukabyemera, ukabihindura cyangwa ukabireka.|Dushaka ko kivuga ukuri ku byo gikora. Ibishushanyo bya AI bishobora kuba birimo amakosa, bityo ugomba gusoma, gukosora no kugira inyandiko iyawe mbere yo kuyereka abakiriya. Ibikoresho bya AI bishingira ku sano ry’umutekano na seriveri riracyategurwa.",
"Imiterere ijyanye n’ibikenewe|Hateguwe isoko ry’imiterere rifite ibishushanyo by’ubucuruzi, ibikorwa by’abahanzi, amaduka ya interineti, amashuri, amavuriro, resitora, amahoteli, amatorero, imiryango itegamiye kuri leta, amazu n’ubutaka, amakuru, ibinyamakuru by’ibitekerezo, umuziki, ibigo by’ubujyanama, impapuro zo kwamamaza, imbonerahamwe n’urubuga rwo kwiga.|Imiterere ubona kuri uru rubuga ni ibishushanyo by’igerageza bifite ibiciro by’urugero. Isoko nirifungurwa, buri miterere izerekana uko isa, ibyo ifite, niba ikora neza kuri telefone, n’igiciro kigaragara mu mafaranga y’u Rwanda mbere y’uko ufata icyemezo.",
"Birenze imbuga|Uretse imbuga, turashaka gushyigikira porogaramu zoroheje za interineti: impapuro zo gufata gahunda, ibikoresho byo gukurikirana ibicuruzwa, ibitabo by’amashuri, urutonde ruto rw’abakiriya n’imbonerahamwe. Ibigo byinshi bikeneye ibi bikoresho ariko ntibishobora kwishyura porogaramu zihariye.|Iyi ni intego y’igihe kirekire. Porogaramu zikenera ububiko bw’amakuru, konti n’umutekano witondewe, bityo zizaza nyuma y’uko ibikoresho by’imbuga bimaze gukora neza. Dukunda gutangiza bike bikora kuruta byinshi bisa neza gusa.",
"Yubakiwe telefone n’interineti isanzwe|Abantu benshi mu karere kacu bagera kuri interineti bakoresheje telefone, akenshi bafite megabayiti nke. Ni cyo gituma igishushanyo gitangirira kuri telefone, kandi dushaka impapuro zoroheje zifungura vuba.|Ntitugaragaza imibare y’umuvuduko kuko nta gicuruzwa cyuzuye turapima. Nitubona ibisubizo nyabyo, tuzabigaragaza tuvuga ukuri, aho gutanga amasezerano tudashobora kwerekana.",
"Ururimi rwawe|Uru rubuga rusanzwe rukora mu Cyongereza, Ikinyarwanda n’Igifaransa, kandi ibyo wahisemo birabikwa nugaruka. Ururimi ni ingenzi kuko abantu bizera kandi bumva ibyanditse uko bavuga.|Mu gihe kizaza turizera gushyigikira izindi ndimi, harimo Igiswahili, no gufasha abafite imbuga gutangaza impapuro zabo mu ndimi nyinshi. Ibisobanuro bizahora bikenera umuntu ubisoma mbere y’uko bitangazwa.",
"Ibiciro bisobanutse kandi bihwanye|Ibiciro kuri uru rubuga biri mu mafaranga y’u Rwanda kandi ni ingero, si ibitangwa bya nyuma. Igitekerezo ni ugutandukanya ibyishyurwa rimwe, nko kugura imiterere, n’ibyishyurwa buri gihe, nko kubika urubuga, kugira ngo nta kintu gihishwa.|Turateganya gushyigikira kwishyura kuri telefone no ku makarita binyuze ku bafatanyabikorwa bizewe. Kugeza byiteguye, nta kintu cyagurwa kuri uru rubuga, kandi ntituzigera tuvuga ko kwishyura byagenze neza keretse uwabigenzaga abyemeje.",
"Umutekano n’amabanga|Imfunguzo z’ibanga za AI, guhindura indimi no kwishyura zigomba kuguma kuri seriveri, ntizigere mu rupapuro rw’urubuga. Konti zizakoresha uburyo bwo kwinjira buzwi, kandi buri muntu agomba kubona no guhindura imishinga ye gusa.|Ubu, amakuru yonyine dukusanya ni izina na imeri utwoherereza kugira ngo wiyandikishe ku rutonde rw’abazabanza. Tuyakoresha gusa kugira ngo tukumenyeshe iby’iki gicuruzwa, kandi ushobora gusaba ko tuyasiba igihe cyose.",
"Inzira iri imbere|Gahunda y’ukuri ifite intambwe nyinshi. Mbere, uru rubuga rusanzwe. Hakurikireho konti no kwinjira. Hanyuma imiterere no kubika imishinga, hagakurikiraho uburyo bwo guhindura ubyirebera, umufasha wa AI, gutangaza, amaherezo kwishyura n’agace k’ubuyobozi.|Tuzavugurura uru rupapuro igihe buri ntambwe izaba ibonetse koko. Nuyandikisha ku rutonde rw’abazabanza, tuzakwandikira nihaba hari icyo ugerageza, kandi ibitekerezo byawe bizadufasha guhitamo ibizakurikiraho.",
"Kuki Isi na sisitemu y’izuba?|Inyuma y’uru rupapuro hagaragara umubumbe wacu uri muri sisitemu y’izuba. Uko umanuka, ishusho igenda iva ku Isi kugeza ubonye Izuba n’imibumbe ruzengurutse. Ni urwibutso ko ibikomeye bitangira ari bito ariko bishobora kugera kure.|Ni ishusho yo gushimisha gusa, ingano n’intera byagabanyijwe kugira ngo byose bigaragare kuri ekara. Imibumbe koko izenguruka Izuba mu murongo ugereranye n’uwo ubona hano. Hepfo ushobora gusoma ibintu bike kuri buri umwe."],
ph:"Menya imibumbe",pI:"Ingano n’intera ntibijyanye n’ukuri; byagabanyijwe kugira ngo ubone byose.",
pn:["Izuba|Inyenyeri ifite hafi 99.8% by’ibiremereye byose bya sisitemu y’izuba. Urumuri rwayo rumara iminota irenga umunani rugera ku Isi.","Merikuri|Umubumbe muto kurusha indi kandi uri hafi y’Izuba. Nta kirere cyinshi ufite.","Venusi|Umubumbe ushyushye kurusha indi, upfutse n’ibicu binini. Umunsi kuri Venusi urenze umwaka wayo.","Isi|Urugo rwacu, ahantu honyine tuzi hari ubuzima. Hafi 71% by’ubuso bwayo ni amazi.","Marsi|Umubumbe ukonje kandi wuzuye umukungugu, ufite ikirunga kirekire kurusha ibindi muri sisitemu y’izuba, Olympus Mons.","Jupiteri|Umubumbe munini kurusha indi, ufite umuyaga ukomeye (Ahantu Hatukura Hanini) urenze Isi.","Saturni|Uzwiho impeta z’urubura n’amabuye. Ufite ibyogajuru byinshi bizwi.","Uranusi|Umubumbe w’urubura uzenguruka wegamye ku ruhande.","Neputuni|Umubumbe uri kure kurusha indi, wijimye, ukonje kandi ufite umuyaga mwinshi."],

tm:["Conditions générales","Ce site est informatif. Le créateur, les comptes, les modèles et les prix sont en développement et pas encore disponibles.","Les fonctionnalités, prix et moyens de paiement prévus peuvent changer avant le lancement.","S’inscrire à la liste d’accès anticipé n’est pas un achat et ne garantit pas l’accès."],
pc:["Politique de confidentialité","Nous collectons uniquement le nom et l’adresse e-mail que vous nous envoyez pour rejoindre la liste d’accès anticipé.","Nous les utilisons uniquement pour vous contacter au sujet d’Ikaze Web Builder. Nous ne vendons pas vos données.","Pour demander la suppression de vos données, écrivez à ikazedigital@gmail.com."],
rt2:"Faites défiler pour lire toute l’histoire — environ 5 minutes.",
ls:["Pourquoi Ikaze Web Builder existe|Pour de nombreuses petites entreprises, créateurs, écoles et associations d’Afrique, avoir un bon site semble encore hors de portée. Engager un développeur coûte cher, les outils gratuits peuvent être déroutants, et beaucoup ne sont pas pensés pour nos besoins, nos langues ou nos habitudes de paiement.|Ikaze Web Builder part d’une conviction simple : si vous savez décrire ce que vous faites, vous devriez pouvoir le montrer au monde. Nous construisons un outil qui cherche à rendre cette étape plus courte, plus claire et plus abordable, en commençant par le Rwanda.",
"Trois façons de commencer|L’idée est de vous laisser démarrer comme vous le préférez : décrire votre projet avec vos propres mots pour obtenir une première ébauche, choisir un modèle prêt à l’emploi et le modifier, ou ouvrir une page blanche et tout construire vous-même.|Aucune de ces voies n’existe encore, mais le principe est le même : vous gardez le contrôle. Une ébauche, un modèle ou une page blanche ne sont que des points de départ, et tout doit rester modifiable par vous.",
"Comment l’IA doit aider|L’IA est prévue comme un assistant, pas comme un remplaçant de votre jugement. Vous décririez une activité, par exemple un atelier de couture à Kigali, et l’outil proposerait des pages, des titres et des textes que vous pourriez accepter, modifier ou jeter.|Nous voulons être honnêtes sur ce qu’elle fait. Les ébauches peuvent contenir des erreurs : relisez, corrigez et adaptez toujours le texte avant de le montrer à vos clients. Les fonctions d’IA dépendent d’une connexion serveur sécurisée encore en préparation.",
"Des modèles pour de vrais besoins|Un marché de modèles est prévu, avec des designs pour entreprises, portfolios, boutiques en ligne, écoles, hôpitaux, restaurants, hôtels, églises, ONG, immobilier, actualités, blogs, musique, agences, pages d’atterrissage, tableaux de bord et plateformes d’apprentissage.|Les modèles de ce site sont des croquis de démonstration avec des prix d’exemple. À l’ouverture du marché, chacun devrait afficher un aperçu, ses fonctions, son adaptation aux téléphones et un prix clair en francs rwandais avant votre décision.",
"Plus que des sites web|Au-delà des sites, nous voulons prendre en charge de simples applications web : pages de réservation, suivi de stock, dossiers scolaires, petits fichiers clients et tableaux de bord. Beaucoup d’organisations ont besoin de ces outils sans pouvoir financer un logiciel sur mesure.|C’est un objectif à long terme. Les applications exigent des bases de données, des comptes et une sécurité rigoureuse ; elles viendront donc après les outils de sites. Nous préférons lancer peu de choses qui fonctionnent plutôt que beaucoup de choses qui n’ont que l’apparence.",
"Pensé pour les téléphones et les vraies connexions|La plupart des gens de notre région accèdent à Internet depuis un téléphone, souvent avec un forfait de données limité. C’est pourquoi la conception part du mobile et vise des pages légères qui se chargent vite.|Nous ne publions pas de chiffres de vitesse, car nous n’avons pas encore mesuré un produit terminé. Quand nous aurons de vrais résultats, nous les partagerons honnêtement plutôt que de faire des promesses invérifiables.",
"Votre langue|Ce site fonctionne déjà en anglais, en kinyarwanda et en français, et votre choix est mémorisé à votre retour. La langue compte, car on fait confiance à ce qui est écrit comme on le parle et on le comprend mieux.|À l’avenir, nous espérons prendre en charge d’autres langues, dont le swahili, et aider les propriétaires de sites à publier leurs pages en plusieurs langues. Les traductions devront toujours être relues par une personne avant publication.",
"Des prix clairs et justes|Les prix de ce site sont en francs rwandais et sont des exemples, pas des offres finales. L’idée est de séparer les coûts uniques, comme l’achat d’un modèle, des coûts récurrents, comme l’hébergement, afin que rien ne soit caché.|Nous prévoyons de prendre en charge le mobile money et les cartes via des prestataires de confiance. D’ici là, rien ne peut être acheté sur ce site, et nous ne dirons jamais qu’un paiement a réussi sans confirmation du prestataire.",
"Sécurité et confidentialité|Les clés secrètes pour l’IA, la traduction et les paiements doivent rester sur un serveur, jamais dans la page web. Les comptes utiliseront des méthodes de connexion reconnues, et chacun ne devrait pouvoir voir et modifier que ses propres projets.|Pour l’instant, nous ne recueillons que le nom et l’e-mail que vous envoyez pour rejoindre la liste d’accès anticipé. Nous les utilisons uniquement pour vous parler de ce produit, et vous pouvez demander leur suppression à tout moment.",
"La suite|La feuille de route honnête comporte plusieurs étapes. D’abord ce site public. Ensuite les comptes et la connexion. Puis les modèles et la sauvegarde des projets, suivis de l’éditeur visuel, de l’assistant IA, de la publication, et enfin des paiements et d’un espace d’administration.|Nous mettrons cette page à jour à mesure que chaque étape sera réellement disponible. Si vous rejoignez la liste d’accès anticipé, nous vous écrirons dès qu’il y aura quelque chose à essayer, et vos retours aideront à décider de la suite.",
"Pourquoi un globe et un système solaire ?|L’arrière-plan de cette page montre notre planète au sein du système solaire. En faisant défiler, la vue s’éloigne de la Terre jusqu’à laisser voir le Soleil et les planètes qui gravitent autour. C’est un rappel : les grandes choses naissent petites et peuvent aller loin.|C’est une scène décorative, dont les tailles et les distances sont raccourcies pour tout faire tenir à l’écran. Les planètes tournent bien autour du Soleil dans l’ordre que vous voyez ici. Vous pouvez lire ci-dessous quelques faits sur chacune."],
ph:"Faites connaissance avec les planètes",pI:"Tailles et distances non à l’échelle : elles sont raccourcies pour tout montrer.",
pn:["Soleil|Une étoile qui concentre environ 99,8 % de la masse du système solaire. Sa lumière met un peu plus de 8 minutes à atteindre la Terre.","Mercure|La plus petite planète et la plus proche du Soleil. Elle n’a presque pas d’atmosphère.","Vénus|La planète la plus chaude, enveloppée de nuages épais. Un jour y dure plus longtemps qu’une année.","Terre|Notre foyer et le seul endroit connu abritant la vie. Environ 71 % de sa surface est couverte d’eau.","Mars|Un monde froid et poussiéreux, avec le plus haut volcan du système solaire, Olympus Mons.","Jupiter|La plus grande planète, une géante gazeuse dont la Grande Tache rouge est plus large que la Terre.","Saturne|Célèbre pour ses anneaux de glace et de roche. Elle possède de nombreuses lunes connues.","Uranus|Une géante de glace qui tourne couchée sur le côté.","Neptune|La planète la plus lointaine, sombre, froide et très venteuse."],
